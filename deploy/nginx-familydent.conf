# Replace familydent.tj with the production domain before enabling.
# Backend app is expected to run on 127.0.0.1:5000 via PM2/systemd.

server {
    listen 80;
    server_name www.familydent.tj;
    return 301 https://familydent.tj$request_uri;
}

server {
    listen 80;
    server_name familydent.tj;
    return 301 https://familydent.tj$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.familydent.tj;

    ssl_certificate /etc/letsencrypt/live/familydent.tj/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/familydent.tj/privkey.pem;

    return 301 https://familydent.tj$request_uri;
}

server {
    listen 443 ssl http2;
    server_name familydent.tj;

    ssl_certificate /etc/letsencrypt/live/familydent.tj/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/familydent.tj/privkey.pem;

    client_max_body_size 20M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/xml
        image/svg+xml
        font/woff2;

    brotli on;
    brotli_comp_level 5;
    brotli_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/xml
        image/svg+xml
        font/woff2;

    location ~* \.(js|css|woff2|svg|png|jpg|jpeg|webp|avif|ico)$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
